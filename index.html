<title>Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Outfit:wght@200;300&family=Patrick+Hand&display=swap">
<style>
/* Layout: a quiet planter. Timer screen is one flat sage field with a cream circle; garden screen is a voxel tile on forest green with a paper panel sliding up beneath it. */
:root{
  --sage:#5A9E86; --forest:#2F6A55; --cream:#F2EBC9; --paper:#F1F4F0; --ink:#2A3B31; --muted:#6B776A; --line:#DCE4DE;
  --soil:#7B4E2C; --soil-d:#573419; --disc:#F2EBC9;
  --c-new:#4C9A78; --c-review:#D1A03E; --c-practice:#BC6A45;
  --bloom:#B97A14; --wither:#8A7550; --danger:#A9442F; --danger-soft:#F2DDD3;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-time:'Outfit','Avenir Next','Helvetica Neue',system-ui,sans-serif;
  --font-hand:'Patrick Hand','Segoe Print','Bradley Hand',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--sage);background-image:radial-gradient(130% 90% at 50% 42%,rgba(0,0,0,0) 58%,rgba(20,60,45,.2) 100%);background-attachment:fixed;color:var(--ink);font:400 16px/1.45 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:root[data-kb] :focus-visible{outline:2px solid var(--ring,var(--cream));outline-offset:2px}
.panel,.modal{--ring:var(--forest)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--forest)}
h1,h2,h3{font-family:var(--font-body);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.pad{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{color:var(--muted);font-size:.9rem}
.hand{font-family:var(--font-hand);font-weight:400;font-size:1.6rem;color:var(--forest)}

/* ---- timer screen ---- */
.fwrap{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;position:relative}
.fwrap .hdr{position:absolute;top:0;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px))}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding-top:8px}
.title{margin:0;font:400 1.75rem/1 var(--font-hand);color:var(--cream);display:flex;align-items:center;gap:8px}
.title svg{width:22px;height:22px}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(242,235,201,.16);border:1.5px solid rgba(242,235,201,.5);color:var(--cream);text-decoration:none}
.rbtn:hover{background:rgba(242,235,201,.26)}
.rbtn svg{width:24px;height:24px}
.focus{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;gap:clamp(10px,2dvh,16px);padding:68px 0 28px;padding:clamp(52px,8dvh,68px) 0 clamp(20px,4dvh,40px);text-align:center}
.say{color:var(--cream);font-weight:700;letter-spacing:.02em;min-height:1.5em}
.discwrap{position:relative;isolation:isolate;flex:none;width:min(72vw,300px);width:min(72vw,34dvh,300px);aspect-ratio:1}
.disc{position:relative;width:100%;height:100%;border-radius:50%;background:var(--disc);overflow:hidden;display:flex;justify-content:center;align-items:flex-end;box-shadow:0 14px 34px rgba(20,60,45,.2)}
.disc svg{height:100%;width:100%;display:block;transform-origin:50% 100%}
.disc svg.wither-in,.disc svg.droop-out{position:absolute;inset:0}
.tpill{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:6px 16px;border-radius:999px;border:1.5px solid rgba(242,235,201,.55);background:rgba(242,235,201,.1);color:var(--cream);font-weight:700}
button.tpill::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.time{font-family:var(--font-time);font-weight:300;font-size:clamp(5.2rem,30vw,9.5rem);font-size:clamp(4.4rem,min(28vw,12dvh),9.5rem);line-height:1;display:flex;justify-content:center;color:var(--cream);opacity:.88}
.time .d{display:inline-block;width:.58em;text-align:center}
.time .c{display:inline-block;width:.3em;text-align:center}
.ending .ctl{opacity:0;pointer-events:none}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl .row{display:flex;gap:6px}
.pillbtn{min-width:220px;min-height:62px;border-radius:999px;border:none;background:var(--cream);color:var(--forest);font:800 1.2rem var(--font-body);box-shadow:0 5px 0 rgba(30,85,62,.28);transition:transform .12s,box-shadow .12s}
.pillbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(30,85,62,.28)}
button.giveup{color:#5B2819;text-decoration:none;font-size:.9rem;font-weight:800;margin-left:8px;opacity:1}
.quiet{background:none;border:none;color:var(--cream);font-weight:700;min-height:46px;padding:0 14px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(242,235,201,.5)}

/* ---- garden screen ---- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;border-radius:999px;background:rgba(0,0,0,.2);max-width:360px;margin:6px auto 0}
.seg button{border:none;background:none;color:var(--cream);padding:8px 0;border-radius:999px;font-weight:700;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--forest)}
.rnav{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--cream);font-weight:700;margin-top:6px}
.rnav button{background:none;border:none;color:var(--cream);font-size:1.6rem;line-height:1;width:44px;height:44px;border-radius:50%}
.rnav button:disabled{opacity:.3;cursor:default}
.rnav span{min-width:150px;text-align:center}
.plotbox{position:relative;max-width:540px;margin:0 auto}
.plot{width:100%;height:auto;display:block}
.hud{position:absolute;top:0;right:2px;display:flex;flex-direction:column;align-items:flex-end;gap:0;color:var(--cream);text-shadow:0 1px 3px rgba(10,50,35,.5)}
.hud-t{font:400 1.05rem/1.2 var(--font-hand);opacity:.75}
.hud-r{display:flex;align-items:center;gap:7px;font-weight:800;font-size:1.55rem;line-height:1.15;font-variant-numeric:tabular-nums}
.hud-r svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(10,50,35,.4))}
.empty-note{text-align:center;color:var(--cream);opacity:.85;padding:4px 0 28px;font-weight:600}
.panel{background:var(--paper);border-radius:30px 30px 0 0;margin-top:-6px;padding-top:26px;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));min-height:62dvh;box-shadow:0 -10px 30px rgba(10,40,28,.18)}
.panel .pad{display:flex;flex-direction:column;gap:12px}
.panel section{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 9.5px var(--font-body);fill:var(--muted)}
.goalrow{display:flex;align-items:center;gap:12px}
.meter{position:relative;flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,rgba(185,122,20,.26) 0 3px,transparent 3px 7px)}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--sage)}
.meter .fill.hit{background:var(--bloom)}
.glabel{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.devrow{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.fine{color:var(--muted);font-size:.82rem}
.devrow b{display:block;font-size:.95rem}
.sw{flex:none;width:50px;height:30px;border-radius:99px;border:none;background:#C5D1C9;position:relative;padding:0;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--forest)}
.sw[aria-checked="true"] i{transform:translateX(20px)}
.split-row{display:flex;flex-direction:column;gap:6px}
.split-row .l{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gc,var(--muted));flex:none;display:inline-block;margin-right:8px}
.sbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--gc);border-radius:99px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{list-style:none;margin:0;padding:0}
.row-item{position:relative;display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.row-btn{flex:1;min-width:0;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:left;background:none;border:none;padding:14px 0;border-radius:12px}
.row-btn:hover .ri-name{text-decoration:underline;text-underline-offset:3px}
.thumb{width:48px;height:48px;border-radius:50%;background:var(--disc);overflow:hidden;display:flex;justify-content:center;flex:none}
.thumb svg{height:100%;width:100%}
.ri-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.ri-name{font-weight:800;font-size:1.02rem}
.ri-meta{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.ri-note{color:var(--muted);font-style:italic;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{align-self:center;flex:none;width:44px;height:44px;border-radius:50%;border:none;background:none;color:var(--muted);font-size:1.5rem;line-height:1;letter-spacing:1px;padding-bottom:6px}
.more:hover,.more[aria-expanded="true"]{background:rgba(47,106,85,.1);color:var(--forest)}
.menu{position:absolute;right:0;top:calc(50% + 18px);z-index:4;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 8px 24px rgba(20,50,35,.18);display:flex;flex-direction:column}
.menu button{background:none;border:none;text-align:left;padding:10px 14px;border-radius:10px;font-weight:700;min-height:44px}
.menu button:hover{background:#EAF0EC}
.menu .del{color:var(--danger)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- buttons, sheets, forms (paper surfaces) ---- */
.btn{min-height:48px;border-radius:999px;border:1.5px solid #C5D1C9;background:transparent;color:var(--ink);padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost-danger{color:var(--danger);border-color:#E3B7A8}
.btn.small{min-height:38px;padding:0 16px;font-size:.88rem}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(14,40,30,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--paper);color:var(--ink);border-radius:26px;width:100%;max-width:440px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:calc(100% - 8px);overflow:auto}
.modal h2{font-family:var(--font-hand);font-weight:400;font-size:1.75rem;color:var(--forest)}
.modal h3{font-size:1rem}
.modal .btns{display:grid;gap:10px}
.modal .btns.two{grid-template-columns:1fr 1fr}
.res-flower{width:200px;aspect-ratio:1;margin:0 auto;display:flex;justify-content:center;border-radius:50%;background:var(--disc);overflow:hidden;flex:none}
.res-flower svg{height:100%;width:100%}
.group-h{display:flex;align-items:center;font:400 1.35rem/1 var(--font-hand);color:var(--forest);margin-bottom:8px}
.topics{display:grid;grid-template-columns:1fr;gap:8px}
.topic{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 10px 5px 5px;min-height:54px;border-radius:999px;border:1.5px solid var(--line);background:#F9FBF8;font-weight:700;line-height:1.15;min-width:0}
.topic .thumb{width:42px;height:42px}
.topic[aria-pressed="true"]{border-color:var(--forest);background:#E1EDD7}
.lens{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.len{padding:10px 0;border-radius:18px;border:1.5px solid var(--line);background:#F9FBF8;font-weight:700;text-align:center;line-height:1.1}
.len b{display:block;font:800 1.5rem/1 var(--font-body)}
.len small{color:var(--muted);font-weight:700}
.len[aria-pressed="true"]{border-color:var(--forest);background:#E1EDD7}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:800;font-size:.9rem}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:#F9FBF8;border-radius:14px;padding:10px 12px;min-height:46px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-weight:700;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion: no-preference){
  .discwrap.bounce{animation:bounce 1s ease-out .3s}
  .headpop{transform-box:fill-box;transform-origin:50% 60%;animation:headpop .9s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes headpop{0%{transform:scale(.7)}100%{transform:scale(1)}}
  .pt{transform-box:fill-box;transform-origin:50% 100%;animation:petalOpen .75s cubic-bezier(.3,1.5,.5,1) both}
  circle.pt{transform-origin:50% 50%}
  @keyframes petalOpen{0%{transform:scale(0) rotate(-24deg);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
  .budfade{animation:budfade .6s ease-in .15s both}
  @keyframes budfade{from{opacity:1}to{opacity:0}}
  .glow{position:absolute;inset:-14%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(255,238,170,.85) 0,rgba(255,238,170,0) 64%);pointer-events:none;animation:glow 1.5s ease-out .15s both}
  @keyframes glow{0%{opacity:0;transform:scale(.7)}30%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
  .spark{position:absolute;pointer-events:none;background:#FFE58A;clip-path:polygon(50% 0,60% 38%,100% 50%,60% 62%,50% 100%,40% 62%,0 50%,40% 38%);opacity:0;animation:twinkle 1.1s ease-in-out both}
  @keyframes twinkle{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1) rotate(80deg)}100%{opacity:0;transform:scale(.3) rotate(160deg)}}
  .petal{position:absolute;left:50%;top:30%;width:11px;height:15px;border-radius:70% 0 70% 0;opacity:0;pointer-events:none;animation:drift 2.4s ease-in both;box-shadow:inset 0 0 0 1px rgba(60,40,0,.18)}
  @keyframes drift{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
  .disc svg.droop-out .sway{animation:droopOut 1.1s ease-in forwards;transform-origin:100px 236px}
  @keyframes droopOut{0%{filter:none;opacity:1;transform:none}55%{filter:sepia(.85) saturate(.7) brightness(.9);opacity:1;transform:rotate(6deg)}100%{filter:sepia(1) saturate(.6) brightness(.85);opacity:0;transform:rotate(11deg)}}
  .disc svg.wither-in{position:absolute;inset:0;animation:witherIn 1s ease-out .45s both}
  @keyframes witherIn{from{opacity:0}to{opacity:1}}
  .plantpop{transform-box:fill-box;transform-origin:50% 100%;animation:plantpop .8s cubic-bezier(.3,1.7,.5,1) both}
  @keyframes plantpop{0%{transform:scale(0)}100%{transform:scale(1)}}
  .alive .sway{animation:sway 5s ease-in-out infinite;transform-origin:100px 236px}
  @keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
  .disc svg.pop{animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.93)}100%{transform:none}}
  .res-flower.bounce{animation:bounce 1s ease-out .15s}
  @keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}55%{transform:translateY(0)}75%{transform:translateY(-6px)}}
}
</style>

<main>
  <section id="view-focus" aria-label="Focus"></section>
  <section id="view-garden" aria-label="Garden" hidden></section>
</main>
<div id="modal-root" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const GOAL_H=12, STRETCH_H=15, MIN_LOG_SECS=30;
const GROUPS={
  new:{name:'New learning',color:'var(--c-new)'},
  review:{name:'Review',color:'var(--c-review)'},
  practice:{name:'Practice',color:'var(--c-practice)'}
};
const TOPICS=[
  {id:'retirement',name:'Retirement',group:'new',flower:'sunflower'},
  {id:'estate',name:'Estate',group:'new',flower:'iris'},
  {id:'capstone',name:'Capstone',group:'new',flower:'rose'},
  {id:'fundamentals',name:'Fundamentals / Insurance',group:'review',flower:'daisy'},
  {id:'tax',name:'Tax',group:'review',flower:'tulip'},
  {id:'investments',name:'Investments',group:'review',flower:'lavender'},
  {id:'practice',name:'Practice Questions',group:'practice',flower:'poppy'}
];
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const FLOWER_NAME={sunflower:'Sunflower',iris:'Iris',rose:'Rose',daisy:'Daisy',tulip:'Tulip',lavender:'Lavender',poppy:'Poppy'};
const TIERS={
  25:{ti:0,layers:1,leaves:2,scale:.8,extras:0,desc:'Simple single bloom'},
  45:{ti:1,layers:2,leaves:4,scale:.92,extras:0,desc:'Fuller bloom with more leaves'},
  60:{ti:2,layers:3,leaves:4,scale:1.04,extras:1,desc:'Rich bloom with a side blossom'},
  90:{ti:3,layers:4,leaves:6,scale:1.14,extras:2,desc:'Grand bloom with two side blossoms'}
};
const TIER_LIST=[25,45,60,90];

/* ---------- storage (try/catch, memory fallback) ---------- */
const LS_KEY='focusGarden.v1';
let mem=null;
function load(){
  let s=null;
  try{const r=localStorage.getItem(LS_KEY);if(r)s=JSON.parse(r);}catch(e){}
  if(!s&&mem)s=mem;
  s=s&&typeof s==='object'?s:{};
  if(!Array.isArray(s.sessions))s.sessions=[];
  if(!s.prefs)s.prefs={topic:'retirement',tier:45};
  if(!TOPIC[s.prefs.topic])s.prefs.topic='retirement';
  if(!TIERS[s.prefs.tier])s.prefs.tier=45;
  if(!s.timer)s.timer=null;
  if(!Array.isArray(s.fresh))s.fresh=[];
  if(!Array.isArray(s.pendPut))s.pendPut=[];
  if(!Array.isArray(s.pendDel))s.pendDel=[];
  return s;
}
let state=load();
function persist(){mem=state;try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function save(){persist();if(typeof Sync!=='undefined'&&Sync.base)Sync.push();}

/* ---------- small utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fmtClock(ms){const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60);}
function fmtDur(secs){
  secs=Math.max(0,Math.round(secs));
  const h=Math.floor(secs/3600),m=Math.floor(secs%3600/60);
  if(h)return h+'h '+pad(m)+'m';
  if(m)return m+' min';
  return secs+' sec';
}
function fmtHM(secs){
  const tm=Math.floor(secs/60),h=Math.floor(tm/60),m=tm%60;
  return h?h+'h '+pad(m)+'m':m+'m';
}
function fmtDate(ts){return new Date(ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function weekStart(d){const x=new Date(d);const k=(x.getDay()+6)%7;return new Date(x.getFullYear(),x.getMonth(),x.getDate()-k).getTime();}
function weekBounds(now=Date.now()){const s=weekStart(now);const e=new Date(s);e.setDate(e.getDate()+7);return [s,e.getTime()];}
function dateInputVal(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function tierForMinutes(m){return m<35?25:m<52?45:m<75?60:90;}
function stageOf(p){return p<.12?'sprout':p<.45?'growing':p<1?'budding':'bloomed';}
const STAGE_LABEL={sprout:'Sprout',growing:'Growing',budding:'Budding',bloomed:'Bloomed',withered:'Withered'};

let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3600);}

/* ---------- flower art (original, drawn in code) ---------- */
const FL={
  sunflower:{petal:'#F5B91E',petal2:'#E08A12',center:'#5B3A1D',center2:'#8A5A2B',leaf:1.2,ly:1},
  iris:{petal:'#6A4CC2',petal2:'#9C86E8',center:'#F2C94C',center2:'#F2C94C',leaf:1,ly:.8},
  rose:{petal:'#D6336C',petal2:'#A31F4C',center:'#7E123A',center2:'#7E123A',leaf:1,ly:1},
  daisy:{petal:'#FFFFFF',petal2:'#E2EAF1',center:'#F4B72C',center2:'#D99A14',leaf:.9,ly:.8},
  tulip:{petal:'#F0683A',petal2:'#D2441F',center:'#F0683A',center2:'#F0683A',leaf:1.15,ly:.7,lift:16},
  lavender:{petal:'#A184DA',petal2:'#7C5CBE',center:'#7C5CBE',center2:'#7C5CBE',leaf:.8,ly:.5,thin:1},
  poppy:{petal:'#E8392B',petal2:'#C22216',center:'#2B2024',center2:'#2B2024',leaf:.95,ly:.9}
};
const WITHER={petal:'#BBA578',petal2:'#927C57',center:'#5E4B35',center2:'#7A6446'};
const LEAF='#4E8F45', LEAF_D='#3E7538', LEAF_W='#8E8055', STEM='#4A8A41', STEM_W='#8B7C52';
const OUT='stroke="rgba(30,20,10,.22)" stroke-width=".9"';
const E=(cx,cy,rx,ry,fill,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" ${x}/>`;
const C=(cx,cy,r,fill,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" ${x}/>`;
const ring=(n,off,fn)=>{let o='';for(let i=0;i<n;i++)o+=`<g transform="rotate(${(off+i*360/n).toFixed(2)})">${fn(i)}</g>`;return o;};
const POINT='M0 0 C-11 -12 -10 -30 0 -42 C10 -30 11 -12 0 0Z';

const HEADS={
  sunflower(c,L){
    let o=ring(12,0,()=>E(0,-28,5.8,15,c.petal2,OUT));
    if(L>=2)o+=ring(12,15,()=>E(0,-27,5.8,14,c.petal,OUT));
    if(L>=3)o+=ring(12,7.5,()=>E(0,-22,4.8,11,c.petal,OUT));
    o+=C(0,0,15,c.center);
    const n=16+L*10;
    for(let i=1;i<=n;i++){const r=Math.sqrt(i/n)*13,a=i*2.39996;o+=C((Math.cos(a)*r).toFixed(1),(Math.sin(a)*r).toFixed(1),1.1,c.center2);}
    return o;
  },
  iris(c,L){
    let o='';
    for(let k=L-1;k>=0;k--){
      const sc=1-k*.14,off=k*30;
      o+=ring(3,off+60,()=>`<g transform="scale(${sc})"><path d="${POINT}" fill="${c.petal2}" ${OUT}/></g>`);
      o+=ring(3,off,()=>`<g transform="scale(${(sc*.88).toFixed(2)})"><path d="${POINT}" fill="${c.petal}" ${OUT}/></g>`);
    }
    o+=ring(3,60,()=>E(0,-12,2.6,7,c.center,'opacity=".95"'));
    o+=C(0,0,4,c.center2);
    return o;
  },
  rose(c,L){
    const rings=[[7,24,15,c.petal2],[6,18,14,c.petal],[5,12,12,c.petal2],[5,7,9,c.petal],[4,3,7,c.petal2]];
    let o='';
    rings.slice(-(L+1)).forEach(([n,d,r,fill],i)=>{o+=ring(n,i*17,()=>C(0,-d,r,fill,OUT));});
    o+=C(0,0,6,c.petal,OUT);
    o+=`<path d="M-4 2 C-5 -6 6 -6 6 1 C6 7 -2 8 -3 3" fill="none" stroke="rgba(60,0,20,.45)" stroke-width="1.5" stroke-linecap="round"/>`;
    return o;
  },
  daisy(c,L){
    let o='';
    for(let k=L-1;k>=0;k--)o+=ring(14+k*2,k*6,()=>E(0,-(25-k*2.5),4.2,16-k*1.5,k%2?c.petal2:c.petal,OUT));
    o+=C(0,0,10,c.center,OUT);
    for(let i=0;i<7;i++){const a=i*.9;o+=C((Math.cos(a)*4.5*(i%2?1:.6)).toFixed(1),(Math.sin(a)*4.5*(i%2?1:.6)).toFixed(1),1.4,c.center2);}
    return o;
  },
  tulip(c,L){
    let o='';
    for(let k=L-1;k>=1;k--){
      o+=`<g transform="rotate(${-k*13} 0 16)"><path d="M0 18 C-15 12 -13 -22 0 -38 C13 -22 15 12 0 18 Z" fill="${c.petal2}" ${OUT}/></g>`;
      o+=`<g transform="rotate(${k*13} 0 16)"><path d="M0 18 C-15 12 -13 -22 0 -38 C13 -22 15 12 0 18 Z" fill="${c.petal2}" ${OUT}/></g>`;
    }
    o+=`<path d="M0 16 C-22 14 -24 -10 -17 -32 C-9 -22 -3 -8 0 16 Z" fill="${c.petal2}" ${OUT}/>`;
    o+=`<path d="M0 16 C22 14 24 -10 17 -32 C9 -22 3 -8 0 16 Z" fill="${c.petal2}" ${OUT}/>`;
    o+=`<path d="M0 18 C-15 12 -13 -22 0 -40 C13 -22 15 12 0 18 Z" fill="${c.petal}" ${OUT}/>`;
    o+=`<path d="M0 14 C-4 0 -4 -18 0 -32" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.5" stroke-linecap="round"/>`;
    return o;
  },
  lavender(c,L){
    const n=4+L*2;let o='';
    for(let i=n-1;i>=0;i--){
      const y=-i*5.6-2,w=1-i/(n*1.6),fill=i%2?c.petal:c.petal2;
      o+=`<g transform="translate(${(-4.6*w).toFixed(1)} ${y}) rotate(-22)">${E(0,0,3.3,5.4,fill,OUT)}</g>`;
      o+=`<g transform="translate(${(4.6*w).toFixed(1)} ${y}) rotate(22)">${E(0,0,3.3,5.4,fill,OUT)}</g>`;
    }
    o+=E(0,-n*5.6-4,3,5.4,c.petal,OUT);
    return o;
  },
  poppy(c,L){
    let o='';
    const sets=[[45,1,c.petal2],[0,.9,c.petal],[45,.72,c.petal2],[0,.58,c.petal]];
    for(let k=0;k<L;k++){const [off,s,fill]=sets[k];o+=ring(4,off,()=>`<g transform="scale(${s})">${E(0,-15,19,18,fill,OUT)}${k===0?E(0,-3,5,3.4,c.center,'opacity=".75"'):''}</g>`);}
    o+=C(0,0,7.5,c.center);
    o+=ring(14,0,()=>`<path d="M0 -7 L0 -13" stroke="${c.center}" stroke-width="1.2"/>`+C(0,-14,1.5,c.center));
    return o;
  }
};
function buddy(f,c,s){ // closed bud drawn at origin, growing up
  let o='';
  if(f==='lavender'){
    o+=`<path d="M0 0 L0 -24" stroke="${LEAF}" stroke-width="3" stroke-linecap="round"/>`;
    for(let i=0;i<4;i++)o+=E(i%2?2.5:-2.5,-6-i*5,2.6,3.6,c.petal||FL[f].petal);
    return `<g transform="scale(${s})">${o}</g>`;
  }
  if(f==='sunflower'){
    o+=ring(10,0,()=>E(0,-12,2.6,6,c.petal||FL[f].petal));
    o+=C(0,0,12,'#5C9A4E');
    o+=C(0,0,7,'#6DAE5C');
    return `<g transform="scale(${s})">${o}</g>`;
  }
  const col=c.petal2||FL[f].petal2, col2=c.petal||FL[f].petal;
  o+=E(0,-9,8.5,13,col,OUT)+E(0,-11,4,9,col2,'opacity=".8"');
  o+=`<path d="M-9 -2 C-9 8 9 8 9 -2 C6 2 -6 2 -9 -2Z" fill="${LEAF}"/>`;
  o+=`<path d="M-8 0 C-12 -8 -9 -14 -4 -16" fill="none" stroke="${LEAF}" stroke-width="2.4" stroke-linecap="round"/>`;
  o+=`<path d="M8 0 C12 -8 9 -14 4 -16" fill="none" stroke="${LEAF}" stroke-width="2.4" stroke-linecap="round"/>`;
  return `<g transform="scale(${s})">${o}</g>`;
}
function leaf(x,y,side,s,ly,wil){
  const base=wil?LEAF_W:LEAF,hi=wil?'#A89A6E':'#6DAF5B';
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(side*s).toFixed(3)} ${(s*ly).toFixed(3)}) rotate(${wil?34:-28})"><path d="M0 0 C10 -10 28 -12 40 -2 C28 8 10 8 0 0Z" fill="${base}"/><path d="M0 0 C10 -10 28 -12 40 -2 L2 .5Z" fill="${hi}" opacity=".8"/><path d="M2 0 L35 -2" stroke="rgba(0,0,0,.22)" stroke-width="1.2" fill="none"/></g>`;
}
function headAt(fkey,c,x,y,s,L,rotate=0){
  const lift=FL[fkey].lift||0;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rotate}) scale(${s.toFixed(3)}) translate(0 ${-lift})">${HEADS[fkey](c,L)}</g>`;
}
function ground(){return `<path d="M16 236 L184 236 C178 264 146 282 100 282 C54 282 22 264 16 236Z" style="fill:var(--soil)"/><path d="M30 246 C40 262 62 272 84 275" fill="none" stroke="rgba(255,235,200,.22)" stroke-width="3" stroke-linecap="round"/><ellipse cx="100" cy="236" rx="84" ry="11" style="fill:var(--soil-d)"/>`;}
function animateHead(markup,start){ // each petal gets its own opening delay, back to front
  const n=(markup.match(/<(ellipse|path|circle) /g)||[]).length,step=Math.min(.04,.85/Math.max(1,n));let i=0;
  return markup.replace(/<(ellipse|path|circle) /g,(m,t)=>`<${t} class="pt" style="animation-delay:${(start+(i++)*step).toFixed(3)}s" `);
}
function mixHex(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);return '#'+[16,8,0].map(k=>Math.round(((A>>k)&255)*(1-t)+((B>>k)&255)*t).toString(16).padStart(2,'0')).join('');}
function flowerSVG(fkey,tier,stage,p,anim){
  p=p==null?1:clamp(p);
  const T=TIERS[tier]||TIERS[45],f=FL[fkey],wil=stage==='withered',bloomed=stage==='bloomed';
  if(bloomed)p=1;
  const full=88+T.ti*12, S=.8, bx=100, by=236;
  const g=1-Math.pow(1-p,1.6); // eased, continuous growth 0..1
  const H=wil?full*.9:24+(full-24)*g;
  const topY=by-H, sw=f.thin?3.6:5+T.ti*.6;
  const pop=(h,d)=>anim?`<g class="headpop" style="animation-delay:${d}s">${animateHead(h,d)}</g>`:h;
  let s=`<svg viewBox="-8 92 216 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(FLOWER_NAME[fkey])}, ${esc(STAGE_LABEL[stage])}">`;
  s+=ground();
  if(wil){ // fallen petals on the soil
    [[72,236,-20],[130,237,15],[92,239,40],[148,235,-30]].forEach(([x,y,r])=>{s+=`<g transform="rotate(${r} ${x} ${y})">${E(x,y,6,2.6,WITHER.petal2)}</g>`;});
  }
  s+=`<g class="sway"><g transform="translate(100 236) scale(${S}) translate(-100 -236)">`;
  let ex=bx,ey=topY;
  if(wil){
    ex=128;ey=by-H*.92;
    s+=`<path d="M${bx} ${by} C${bx} ${by-H*.6} ${bx+4} ${by-H*1.0} ${ex} ${ey}" fill="none" stroke="${STEM_W}" stroke-width="${sw}" stroke-linecap="round"/>`;
  }else{
    const sd=`M${bx} ${by} C${bx-4} ${by-H*.35} ${bx+4} ${by-H*.7} ${bx} ${topY}`;
    s+=`<path d="${sd}" fill="none" stroke="${STEM}" stroke-width="${sw}" stroke-linecap="round"/><path d="${sd}" fill="none" stroke="#86C573" stroke-width="${(sw*.3).toFixed(2)}" stroke-linecap="round" opacity=".6" transform="translate(${(-sw*.18).toFixed(2)} 0)"/>`;
  }
  // leaves unfurl one after another as the stem grows
  const n=T.leaves;
  for(let i=0;i<n;i++){
    const grow=wil?1:clamp((p-(-.1+i*.5/n))/.14);
    if(grow<.03)continue;
    const y=by-H*(.14+.46*(i/Math.max(1,n-1)));
    s+=leaf(bx,y,i%2?-1:1,(.5+.5*H/full)*f.leaf*grow*(wil?.9:1),f.ly,wil);
  }
  // side blossoms: buds swell, then open with the main flower
  if(!wil&&p>=.5&&T.extras){
    for(let i=0;i<T.extras;i++){
      const side=T.extras===1?1:(i?1:-1), y0=by-H*(.5+.07*i), tx=bx+side*40, ty=y0-34, e=clamp((p-.5)/.4);
      s+=`<path d="M${bx} ${y0} Q${bx+side*8} ${ty+8} ${tx} ${ty}" fill="none" stroke="${STEM}" stroke-width="2.6" stroke-linecap="round" opacity="${e.toFixed(2)}"/>`;
      s+=bloomed?pop(headAt(fkey,f,tx,ty,.5,1),.55+i*.2):`<g transform="translate(${tx} ${ty})" opacity="${e.toFixed(2)}">${buddy(fkey,{petal:mixHex('#4E8F45',f.petal,clamp((p-.7)/.2)),petal2:mixHex('#4E8F45',f.petal2,clamp((p-.7)/.2))},.6*e)}</g>`;
    }
  }
  // head
  if(wil)s+=headAt(fkey,WITHER,ex,ey,T.scale*.85,Math.min(T.layers,2),128);
  else if(bloomed){
    if(anim)s+=`<g class="budfade" transform="translate(${bx} ${topY})">${buddy(fkey,{petal:f.petal,petal2:f.petal2},T.scale)}</g>`;
    s+=pop(headAt(fkey,f,bx,topY,T.scale,T.layers),.15);
  }
  else{
    const appear=clamp((p-.05)/.1);
    if(appear>0){
      const m=clamp((p-.55)/.3),pal={petal:mixHex('#4E8F45',f.petal,m),petal2:mixHex('#4E8F45',f.petal2,m)};
      s+=`<g transform="translate(${bx} ${topY})">${buddy(fkey,pal,T.scale*(.3+.7*clamp((p-.05)/.9))*appear)}</g>`;
    }
  }
  s+=`</g></g></svg>`;
  return s;
}
function iconSVG(fkey,wil){
  const adj={lavender:[0,26,1],tulip:[0,10,1],sunflower:[0,0,.95],iris:[0,0,.95]}[fkey]||[0,0,1];
  return `<svg viewBox="-48 -50 96 96" aria-hidden="true"><g transform="translate(${adj[0]} ${adj[1]}) scale(${adj[2]})">${HEADS[fkey](wil?WITHER:FL[fkey],2)}</g></svg>`;
}
function miniSVG(fkey,tier,status){return flowerSVG(fkey,tier,status,1);}

/* ---------- timer logic ---------- */
function focusedMs(t,now){
  now=now==null?Date.now():now;
  let ms=t.accMs+(t.resumedAt!=null?Math.max(0,now-t.resumedAt):0);
  return clamp(ms,0,t.plannedMs);
}
function startTimer(){
  const tier=state.prefs.tier,now=Date.now();
  state.timer={topic:state.prefs.topic,tier,plannedMs:tier*60000,accMs:0,resumedAt:now,startedAt:now};
  save();renderFocus();requestWake();
}
function pauseTimer(){
  const t=state.timer;if(!t||t.resumedAt==null)return;
  t.accMs=focusedMs(t);t.resumedAt=null;save();renderFocus();
}
function resumeTimer(){
  const t=state.timer;if(!t||t.resumedAt!=null)return;
  t.resumedAt=Date.now();save();renderFocus();requestWake();
}
function setClockEl(el,clock){if(el.dataset.v===clock)return;el.dataset.v=clock;el.setAttribute('aria-label','Time remaining '+clock);el.innerHTML=clock.split('').map(ch=>ch===':'?'<span class="c">:</span>':'<span class="d">'+ch+'</span>').join('');}
let animating=false,booting=true;
const reduceMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function spawnPetals(wrap,fkey){
  const f=FL[fkey],cols=[f.petal,f.petal2];
  for(let i=0;i<10;i++){
    const el=document.createElement('i');el.className='petal';
    const dir=i%2?1:-1,dx=dir*(30+Math.random()*110),dy=70+Math.random()*120;
    el.style.cssText=`--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--rot:${(Math.random()*600-300).toFixed(0)}deg;background:${cols[i%2]};animation-delay:${(.3+Math.random()*.6).toFixed(2)}s;animation-duration:${(1.9+Math.random()*.9).toFixed(2)}s`;
    wrap.appendChild(el);setTimeout(()=>el.remove(),4200);
  }
}
function spawnSparkles(wrap){
  wrap.insertAdjacentHTML('beforeend','<i class="glow"></i>');
  for(let i=0;i<8;i++){
    const el=document.createElement('i');el.className='spark';
    const a=Math.random()*Math.PI*2,r=45+Math.random()*60,sz=11+Math.random()*9;
    el.style.cssText=`left:calc(50% + ${(Math.cos(a)*r).toFixed(0)}px);top:calc(34% + ${(Math.sin(a)*r*.8).toFixed(0)}px);width:${sz.toFixed(0)}px;height:${sz.toFixed(0)}px;animation-delay:${(.5+Math.random()*.8).toFixed(2)}s`;
    wrap.appendChild(el);setTimeout(()=>el.remove(),3200);
  }
  setTimeout(()=>{const g=wrap.querySelector('.glow');if(g)g.remove();},2200);
}
function playEnd(t,bloomed,done){
  animating=true;
  const topic=TOPIC[t.topic],fl=$('#flower'),wrap=$('#discwrap'),stage=$('#stage');
  stage.classList.add('ending');stage.classList.remove('alive');
  $('#say').textContent=bloomed?'It bloomed!':'It withered…';
  if(bloomed)setClockEl($('#time'),'00:00');
  if(bloomed){
    fl.innerHTML=flowerSVG(topic.flower,t.tier,'bloomed',1,true);
    wrap.classList.add('bounce');spawnPetals(wrap,topic.flower);spawnSparkles(wrap);
    try{navigator.vibrate&&navigator.vibrate([18,40,18]);}catch(e){}
    setTimeout(done,2500);
  }else{
    const cur=fl.firstElementChild;if(cur)cur.classList.add('droop-out');
    fl.insertAdjacentHTML('beforeend',flowerSVG(topic.flower,t.tier,'withered',1).replace('<svg','<svg class="wither-in"'));
    setTimeout(done,1700);
  }
}
function endTimer(bloomed,animate){
  const t=state.timer;if(!t)return;
  const now=Date.now();
  let secs=Math.floor(focusedMs(t,now)/1000),at=now;
  if(bloomed){
    secs=Math.round(t.plannedMs/1000);
    if(t.resumedAt!=null)at=Math.min(now,t.resumedAt+(t.plannedMs-t.accMs));
  }
  state.timer=null;
  let session=null;
  if(secs>=MIN_LOG_SECS){
    session={id:'t'+(t.startedAt||now).toString(36),topic:t.topic,tier:t.tier,secs,status:bloomed?'bloomed':'withered',at,note:'',manual:false};
    state.sessions.push(session);state.fresh.push(session.id);
  }
  save();
  closeModal(true);
  const finish=()=>{animating=false;Sync.lastSig=sigOf();renderAll();if(session)showResult(session);else toast('Under 30 seconds, so nothing was logged.');};
  if(session&&animate&&!reduceMotion()&&!$('#view-focus').hidden&&$('#flower'))playEnd(t,bloomed,finish);
  else finish();
}
let wakeLock=null;
function requestWake(){try{if(navigator.wakeLock&&document.visibilityState==='visible'&&!wakeLock){navigator.wakeLock.request('screen').then(w=>{wakeLock=w;w.addEventListener('release',()=>{wakeLock=null;});}).catch(()=>{});}}catch(e){}}

/* ---------- derived stats ---------- */
function weekSessions(now){const [a,b]=weekBounds(now);return state.sessions.filter(s=>s.at>=a&&s.at<b);}
function weekTotals(now){
  const list=weekSessions(now),by={new:0,review:0,practice:0};let total=0,bloomed=0,withered=0;
  list.forEach(s=>{const g=(TOPIC[s.topic]||{group:'new'}).group;by[g]+=s.secs;total+=s.secs;s.status==='bloomed'?bloomed++:withered++;});
  return {list,by,total,bloomed,withered};
}

/* ---------- Focus view ---------- */
let lastKey='',lastStage='';
function renderFocus(){
  const el=$('#view-focus'),t=state.timer,running=t&&t.resumedAt!=null;
  let ctl;
  if(!t)ctl=`<button class="pillbtn" data-act="start" id="btn-start">Plant</button>`;
  else ctl=`<button class="pillbtn" data-act="${running?'pause':'resume'}" id="${running?'btn-pause':'btn-resume'}">${running?'Pause':'Resume'}</button>
    <div class="row"><button class="quiet" data-act="stop" id="btn-stop">Stop early</button><button class="quiet giveup" data-act="giveup" id="btn-giveup">Give up</button></div>`;
  el.innerHTML=`<div class="pad fwrap">
    <header class="hdr"><h1 class="title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V9"/><path d="M12 10c-3.5 0-4.5-2.5-4.5-5 3.5 0 4.5 2 4.5 5zM12 10c3.5 0 4.5-2.5 4.5-5-3.5 0-4.5 2-4.5 5z"/><path d="M3 18l9 4 9-4-9-4z"/></svg>Garden</h1><a class="rbtn" href="#garden" id="link-garden" aria-label="Open garden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V9"/><path d="M12 10c-3.5 0-4.5-2.5-4.5-5 3.5 0 4.5 2 4.5 5zM12 10c3.5 0 4.5-2.5 4.5-5-3.5 0-4.5 2-4.5 5z"/><path d="M3 18l9 4 9-4-9-4z"/></svg></a></header>
    <div class="focus ${running?'alive':''}" id="stage">
      <p class="say" id="say"></p>

function hash01(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);return (h1>>>0)/4294967296;}
let placeSig='',placeMap=new Map();
function placeAll(){ // every session gets one spot on the plot, the same in Day, Week, Month and Year
  const sig=state.sessions.map(x=>x.id+x.at).join('|');if(sig===placeSig)return placeMap;
  const placed=[],map=new Map();
  state.sessions.slice().sort((a,b)=>a.at-b.at||(a.id<b.id?-1:1)).forEach(x=>{
    let best=null,bestD=-1;
    for(let k=0;k<30;k++){
      const u=.08+.84*hash01(x.id+'u'+k),v=.08+.84*hash01(x.id+'v'+k);
      let md=9;for(const q of placed){const d=Math.hypot(q.u-u,q.v-v);if(d<md)md=d;}
      const need=.2*(1-k/30);
      if(md>=need){best={u,v};break;}
      if(md>bestD){bestD=md;best={u,v};}
    }
    placed.push(best);map.set(x.id,best);
  });

}

function demoSessions(){

  for(let back=sinceMon+14;back>=0;back--){

function rangeBounds(v,off){

function bucketize(v,a,list){

  else{n=12;idx=s=>new Date(s.at).getMonth();lab=i=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i];}

      <div class="rnav"><button data-act="prev" aria-label="Previous ${gRange}">‹</button><span id="range-label">${rangeLabel(gRange,gOff,a,b)}</span><button data-act="next" aria-label="Next ${gRange}" ${gOff>=0?'disabled':''}>›</button></div>
      <div class="plotbox">${isoPlot(shown,n,placeAll())}
        <div class="hud" id="hud"><span class="hud-t">${hudT}</span><span class="hud-r">${IC_B}<b id="rng-bloomed">${bl}</b><span class="sr"> bloomed</span></span><span class="hud-r">${IC_W}<b id="rng-withered">${wi}</b><span class="sr"> withered</span></span></div></div>
      ${list.length?(list.length>144?'<p class="empty-note">Showing the latest 144 flowers.</p>':''):'<p class="empty-note">Nothing planted in this period yet. Finish a focus session to grow a flower here.</p>'}
    </div>
    <div class="panel"><div class="pad">
      <section><h2 class="hand">Focused time distribution</h2>
        <p class="hint" id="chart-total">Total focused time: ${fmtHM(rangeSecs)}</p>${chartSVG(bk.vals,bk.labels)}</section>
      <section><h2 class="hand">This week</h2>
        <div class="goalrow"><div class="meter" role="img" aria-label="${fmtHM(wk.total)} focused this week, goal ${GOAL_H} hours, stretch goal ${STRETCH_H} hours"><div class="zone" style="left:${goal/scale*100}%"></div><div class="fill ${wk.total>=goal?'hit':''}" style="width:${wk.total/scale*100}%"></div></div><span class="glabel" id="wk-total">${fmtHM(wk.total)} / ${GOAL_H}h</span></div>
        ${Object.entries(GROUPS).map(([g,info])=>`<div class="split-row" style="--gc:${info.color}" data-g="${g}"><div class="l"><span><span class="dot"></span>${info.name}</span><span>${fmtHM(wk.by[g])}${wk.total?' · '+Math.round(wk.by[g]/wk.total*100)+'%':''}</span></div><div class="sbar"><i style="width:${wk.total?wk.by[g]/wk.total*100:0}%"></i></div></div>`).join('')}</section>
      <section><div class="sec-h"><h2 class="hand">Sessions</h2><button class="btn small primary" data-act="add" id="btn-add">Add session</button></div>
        ${all.length?`<ul class="list" id="slist">${all.map(s=>{const tp=TOPIC[s.topic];return `<li class="row-item" data-sid="${s.id}">
          <button class="row-btn" data-act="edit" data-id="${s.id}" aria-label="Edit ${esc(tp.name)} session, ${s.status}, ${fmtDate(s.at)}"><span class="thumb">${miniSVG(tp.flower,s.tier,s.status)}</span>
          <span class="ri-main"><span class="ri-name">${esc(tp.name)}</span>
          <span class="ri-meta">${fmtDate(s.at)} · ${fmtTime(s.at)} · ${fmtDur(s.secs)} · ${FLOWER_NAME[tp.flower]}${s.manual?' · Manual':''}</span>
          ${s.note?`<span class="ri-note">Revisit: ${esc(s.note)}</span>`:''}</span></button>
          <button class="more" data-act="menu" data-id="${s.id}" aria-haspopup="menu" aria-expanded="false" aria-label="More actions">⋯</button></li>`;}).join('')}</ul>`
        :`<p class="hint">No sessions yet. Finish a timer or add time you studied without it.</p>`}</section>
      <p class="fine" id="sync-note">${SYNC_TEXT[Sync.mode]}</p>
      <p class="fine">Totals count the time you actually focused, including flowers that withered. Paused time never counts. Weeks run Monday to Sunday. The hatched area of the bar is the ${STRETCH_H}h stretch goal.</p>
      ${devOn||demoOn?`<div class="devrow"><div><b>Seed demo data</b><span class="hint">Developer tool. Adds about 3 weeks of sample sessions. Turn off to remove them.</span></div>
        <button class="sw" role="switch" id="demo-toggle" data-act="demo" aria-checked="${demoOn}" aria-label="Seed demo data"><i></i></button></div>`:''}
    </div></div>`.replace('__CLOCK__',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>`).replace('__INFO__',`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 7v4.5"/><circle cx="8" cy="4.6" r=".6" fill="currentColor"/></svg>`);
}
function renderAll(){renderFocus();renderGarden();}

/* ---------- routing + events ---------- */
function route(){
  const h=location.hash.slice(1),v=(h==='garden'||h==='progress'||h==='dev')?'garden':'focus';
  document.body.dataset.view=v;
  $('#view-focus').hidden=v!=='focus';$('#view-garden').hidden=v!=='garden';
  if(v==='garden'){renderGarden();if(state.fresh.length){state.fresh=[];save();}}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.remove());document.querySelectorAll('.more[aria-expanded="true"]').forEach(x=>x.setAttribute('aria-expanded','false'));}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.querySelector('.more[aria-expanded="true"]');if(m){closeMenus();m.focus();}}});
document.addEventListener('click',e=>{
  if(!e.target.closest('.menu,[data-act="menu"]'))closeMenus();
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,id=b.dataset.id;
  switch(act){
    case 'start':startTimer();break;
    case 'pause':pauseTimer();break;
    case 'resume':resumeTimer();break;
    case 'stop':askWither('stop');break;
    case 'giveup':askWither('giveup');break;
    case 'keep':if(modalKeep)modalKeep();break;
    case 'wither':endTimer(false,true);break;
    case 'sheet':openSheet();break;
    case 'topic':
      state.prefs.topic=id;save();
      document.querySelectorAll('#modal-root [data-act="topic"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.id===id)));
      renderFocus();break;
    case 'tier':
      state.prefs.tier=Number(b.dataset.m);save();
      document.querySelectorAll('#modal-root [data-act="tier"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===b.dataset.m)));
      {const d=$('#tier-desc');if(d)d.textContent=TIERS[state.prefs.tier].desc+'. Longer sessions grow bigger, fuller flowers.';}
      renderFocus();break;
    case 'res-skip':closeModal();break;
    case 'res-save':{
      const s=state.sessions.find(x=>x.id===id),n=$('#res-note').value.trim();
      if(s){s.note=n;save();renderAll();if(n)toast('Note saved to your garden.');}
      closeModal();break;}
    case 'range':gRange=b.dataset.v;gOff=0;renderGarden();break;
    case 'prev':gOff--;renderGarden();break;
    case 'next':if(gOff<0){gOff++;renderGarden();}break;
    case 'add':sessionForm(null);break;
    case 'edit':closeMenus();sessionForm(id);break;
    case 'del':closeMenus();askDelete(id);break;
    case 'menu':{
      const was=b.getAttribute('aria-expanded')==='true';closeMenus();
      if(!was){b.setAttribute('aria-expanded','true');const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
        m.innerHTML=`<button role="menuitem" data-act="edit" data-id="${id}">Edit</button><button role="menuitem" class="del" data-act="del" data-id="${id}">Delete</button>`;
        b.closest('.row-item').appendChild(m);m.querySelector('button').focus();}
      break;}
    case 'del-yes':state.sessions=state.sessions.filter(x=>x.id!==id);save();closeModal(true);renderAll();toast('Session deleted.');break;
    case 'close':closeModal();break;
    case 'demo':{
      if(state.sessions.some(x=>x.demo)){state.sessions=state.sessions.filter(x=>!x.demo);toast('Demo data removed.');}
      else{state.sessions.push(...demoSessions());toast('Demo data added.');}
      save();renderAll();break;}
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='sform'){e.preventDefault();submitSession(e.target);}});


/* ---------- shared database (db capability); local storage stays as the offline cache ---------- */
const SFIELDS=['id','topic','tier','secs','status','at','note','manual','demo'];
function normS(x){const o={};SFIELDS.forEach(k=>{if(x[k]!==undefined&&!(k==='demo'&&!x[k]))o[k]=x[k];});return o;}
const sJson=x=>JSON.stringify(normS(x));
function normTimer(t){return t?{topic:t.topic,tier:t.tier,plannedMs:t.plannedMs,accMs:t.accMs,resumedAt:t.resumedAt==null?null:t.resumedAt,startedAt:t.startedAt}:null;}
function normState(x){return {timer:normTimer(x.timer),prefs:{topic:x.prefs.topic,tier:x.prefs.tier}};}
const sigOf=()=>JSON.stringify([state.sessions.map(sJson).sort(),normState(state)]);
const Sync={base:null,uid:null,mode:'local',gotS:false,gotSt:false,shadow:new Map(),shadowState:null,queued:new Set(),q:Promise.resolve(),inflight:0,lastSig:'',uiPending:false};
const SYNC_TEXT={local:'Saved on this device only.',connecting:'Connecting to your garden…',synced:'Saved to your account. Your garden follows you to your other devices.',saving:'Saving…',offline:'The shared database is not answering. Changes are kept on this device and will sync when it does.',error:'The shared database would not accept a save, so this link may be view-only. Changes stay on this device.'};
function setSync(m){Sync.mode=m;const el=$('#sync-note');if(el)el.textContent=SYNC_TEXT[m];}
function enqueue(key,op){
  if(Sync.queued.has(key))return;Sync.queued.add(key);Sync.inflight++;
  if(Sync.mode==='synced')setSync('saving');
  Sync.q=Sync.q.then(async()=>{
    try{await op();}
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await op();}catch(e2){setSync(e2&&e2.code==='unavailable'?'offline':'error');}}
      else setSync(e&&e.code==='unavailable'?'offline':'error');
    }
  }).then(()=>{Sync.queued.delete(key);Sync.inflight--;if(!Sync.inflight&&(Sync.mode==='saving'||Sync.mode==='synced'))setSync('synced');});
}
Sync.push=function(){
  if(!Sync.base)return;
  const cur=new Map(state.sessions.map(x=>[x.id,x]));
  cur.forEach((x,id)=>{
    const j=sJson(x);
    if(Sync.shadow.get(id)!==j)enqueue('p'+id+j,async()=>{
      const live=state.sessions.find(y=>y.id===id);if(!live)return;
      await Sync.base.collection('sessions').doc(id).set(normS(live));Sync.shadow.set(id,sJson(live));persist();
    });
  });
  Sync.shadow.forEach((j,id)=>{
    if(!cur.has(id))enqueue('d'+id,async()=>{
      if(state.sessions.some(y=>y.id===id))return;
      await Sync.base.collection('sessions').doc(id).delete();Sync.shadow.delete(id);persist();
    });
  });
  const sj=JSON.stringify(normState(state));
  if(sj!==Sync.shadowState)enqueue('st'+sj,async()=>{
    await Sync.base.collection('state').doc('main').set(JSON.parse(sj));Sync.shadowState=sj;
  });
  // what is still waiting to upload survives a reload
  const put=[],del=[];cur.forEach((x,id)=>{if(Sync.shadow.get(id)!==sJson(x))put.push(id);});Sync.shadow.forEach((j,id)=>{if(!cur.has(id))del.push(id);});
  state.pendPut=put;state.pendDel=del;persist();
};
function syncRefresh(){
  const sg=sigOf();if(sg===Sync.lastSig)return;Sync.lastSig=sg;
  if(animating){Sync.uiPending=true;return;}
  renderAll();
}
function onSessions(snap){
  const remote=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)remote.set(d.id,Object.assign({},v,{id:d.id}));});
  const cur=new Map(state.sessions.map(x=>[x.id,x])),old=Sync.shadow,firstEver=state.syncedFor!==Sync.uid;
  const dirty=new Set(),gone=new Set();
  cur.forEach((x,id)=>{if(firstEver||old.get(id)!==sJson(x))dirty.add(id);});
  if(!firstEver)old.forEach((j,id)=>{if(!cur.has(id))gone.add(id);});
  const merged=new Map();
  remote.forEach((v,id)=>{if(!gone.has(id))merged.set(id,v);});
  dirty.forEach(id=>merged.set(id,cur.get(id)));
  state.sessions=[...merged.values()].map(normS);
  Sync.shadow=new Map([...remote].map(([id,v])=>[id,sJson(v)]));
  state.syncedFor=Sync.uid;Sync.gotS=true;persist();
  Sync.push();syncRefresh();
  if(Sync.gotSt&&Sync.mode==='connecting')setSync('synced');
}
function onState(snap){
  Sync.gotSt=true;
  const dirty=JSON.stringify(normState(state))!==Sync.shadowState;
  if(!snap.exists){Sync.shadowState=null;Sync.push();}
  else{
    const d=snap.data()||{},t=d.timer&&TOPIC[d.timer.topic]&&TIERS[d.timer.tier]?normTimer(d.timer):null;
    const pr=d.prefs&&TOPIC[d.prefs.topic]&&TIERS[d.prefs.tier]?{topic:d.prefs.topic,tier:d.prefs.tier}:state.prefs;
    Sync.shadowState=JSON.stringify({timer:t,prefs:{topic:pr.topic,tier:pr.tier}});
    if(!dirty){state.timer=t;state.prefs=pr;persist();}
    else Sync.push();
  }
  syncRefresh();
  if(Sync.gotS&&Sync.mode==='connecting')setSync('synced');
}
async function initSync(){
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    Sync.uid=uid;
    const pp=new Set(state.pendPut||[]),pd=state.pendDel||[];
    Sync.shadow=new Map(state.sessions.filter(x=>!pp.has(x.id)).map(x=>[x.id,sJson(x)]));
    pd.forEach(id=>{if(!Sync.shadow.has(id))Sync.shadow.set(id,'?');});
    Sync.shadowState=JSON.stringify(normState(state));Sync.lastSig=sigOf();
    Sync.base=db.doc('data/users/'+uid+'/garden');
    setSync('connecting');
    const timer=setTimeout(()=>{if(!(Sync.gotS&&Sync.gotSt))setSync('offline');},10000);
    const definitive=(fn,flag)=>snap=>{if(snap.metadata&&snap.metadata.fromCache&&!Sync[flag])return;clearTimeout(timer);fn(snap);};
    Sync.base.collection('sessions').onSnapshot(definitive(onSessions,'gotS'),e=>setSync('error'));
    Sync.base.collection('state').doc('main').onSnapshot(definitive(onState,'gotSt'),e=>setSync('error'));
    window.addEventListener('online',()=>Sync.push());
    const el=$('#sync-note');if(el)el.textContent=SYNC_TEXT[Sync.mode];
  }catch(e){}
}

/* ---------- boot ---------- */
setInterval(()=>updateTick(false),250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){updateTick(false);if(state.timer&&state.timer.resumedAt!=null)requestWake();}});
window.addEventListener('storage',e=>{if(e.key===LS_KEY){state=load();renderAll();}});
renderAll();
route();
document.addEventListener('keydown',e=>{if(e.key==='Tab'||e.key.indexOf('Arrow')===0)document.documentElement.dataset.kb='1';});
document.addEventListener('pointerdown',()=>{delete document.documentElement.dataset.kb;});
// A timer that finished while the page was closed is settled here and shows its result.
updateTick(false);
booting=false;
initSync();
})();
</script>
